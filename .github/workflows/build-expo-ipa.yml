name: Build Free Expo iOS IPA (Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/expo-v2-foundation
    paths:
      - "expoApp/**"
      - ".github/workflows/build-expo-ipa.yml"

permissions:
  contents: read

concurrency:
  group: expo-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Free Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: expoApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Print Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version
          ls -ld /Applications/Xcode*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch node_modules for Swift 6.0 / Xcode 16.2
        run: node scripts/patch-swift6-manifest.js

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Xcode Node environment
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Prebuild ExpoModulesJSI xcframework
        run: |
          node scripts/patch-swift6-manifest.js
          cd ios
          export PODS_ROOT="$(pwd)/Pods"
          export PLATFORM_NAME="iphoneos"
          SCRIPT=$(find ../node_modules -name "build-xcframework.sh" | head -n 1)
          if [ -n "$SCRIPT" ]; then
            echo "Prebuilding ExpoModulesJSI with: $SCRIPT"
            bash "$SCRIPT" 2>&1 | tee ../build_xcframework.log || {
              echo "::error::ExpoModulesJSI build failed! Displaying compiler errors:"
              grep -E "error:" ../build_xcframework.log || tail -n 100 ../build_xcframework.log
              exit 1
            }
          fi

      - name: Build unsigned iOS archive
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          APP_NAME=$(basename $(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1) .xcodeproj)
          echo "Found workspace: $WORKSPACE"
          echo "Building main application scheme: $APP_NAME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../archive.log || {
              echo "::error::xcodebuild archive failed! Displaying errors:"
              grep -E "error:" ../archive.log || tail -n 100 ../archive.log
              exit 1
            }

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r PriceIntelligenceV2-unsigned.ipa Payload
          ls -lh PriceIntelligenceV2-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceIntelligenceV2-ipa
          path: expoApp/PriceIntelligenceV2-unsigned.ipa
          retention-days: 14
