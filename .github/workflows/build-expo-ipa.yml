name: Build Free Expo iOS IPA (Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/expo-v2-foundation
    paths:
      - "expoApp/**"
      - ".github/workflows/build-expo-ipa.yml"

permissions:
  contents: read

concurrency:
  group: expo-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Free Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: expoApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch ExpoModulesJSI for Swift 6.0 / Xcode 16.2
        run: |
          echo "Patching swift-tools-version to 6.0 in all Package.swift files..."
          find node_modules -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} + || true

          echo "Disabling Swift 6.2 upcoming features in Package.swift..."
          find node_modules -name "Package.swift" -exec sed -i '' 's/\.enableUpcomingFeature(/\/\/ .enableUpcomingFeature(/g' {} + || true

          echo "Patching weak let -> weak var in Swift files..."
          find node_modules -name "*.swift" -exec sed -i '' 's/weak let/weak var/g' {} + || true

          echo "Patching SWIFT_RETURNS_RETAINED in RuntimeScheduler.h..."
          find node_modules -name "RuntimeScheduler.h" -exec sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler/RuntimeScheduler/g' {} + || true

          echo "Removing -quiet flag from build-xcframework.sh..."
          find node_modules -name "build-xcframework.sh" -exec sed -i '' 's/-quiet//g' {} + || true

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Xcode Node environment
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Prebuild ExpoModulesJSI xcframework
        run: |
          cd ios
          export PODS_ROOT="$(pwd)/Pods"
          export PLATFORM_NAME="iphoneos"
          SCRIPT=$(find ../node_modules -name "build-xcframework.sh" | head -n 1)
          if [ -n "$SCRIPT" ]; then
            echo "Prebuilding ExpoModulesJSI with: $SCRIPT"
            bash "$SCRIPT"
          fi

      - name: Build unsigned iOS archive
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          APP_NAME=$(basename $(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1) .xcodeproj)
          echo "Found workspace: $WORKSPACE"
          echo "Building main application scheme: $APP_NAME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r PriceIntelligenceV2-unsigned.ipa Payload
          ls -lh PriceIntelligenceV2-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceIntelligenceV2-ipa
          path: expoApp/PriceIntelligenceV2-unsigned.ipa
          retention-days: 14
