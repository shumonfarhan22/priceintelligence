name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'iphone-checkpoint-*'

permissions:
  contents: read

concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Kotlin Native compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-v1-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.10

      - name: Run shared iPhone tests
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: List available schemes (only useful if the next step fails)
        run: xcodebuild -list -project iosApp/iosApp.xcodeproj

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            clean build

      - name: Package into unsigned IPA
        run: |
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r *.app Payload/
          zip -r unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/Build/Products/Release-iphoneos/unsigned.ipa
